# Builds the XML sitemap (sitemaps.org protocol) for https://pato.is-a.dev/
# (all subpages included) and commits it back to this repository.
#
# Token-less: no PAT or repository secrets are needed.
#  - The Python script uses only public data (live site crawl + public
#    GitHub API) — no token at all.
#  - The commit step uses the built-in GITHUB_TOKEN that Actions
#    provides automatically.

name: Build XML sitemap

on:
  schedule:
    - cron: "23 6 * * 1" # every Monday 06:23 UTC
  workflow_dispatch: # manual run button
  push: # rerun when the script or this workflow changes
    branches: ["main"]
    paths:
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/sitemap.yml"

permissions:
  contents: write # commit sitemap.txt with the built-in GITHUB_TOKEN
  actions: write # ask the Pages workflow to redeploy (see the last step)

concurrency:
  group: sitemap
  cancel-in-progress: false

jobs:
  sitemap:
    runs-on: ubuntu-latest
    env:
      # Optional: raises the public API rate limit. Automatically provided
      # by Actions — nothing to configure. The script works without it too.
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # stdlib only — no pip install needed

      - name: Test generator
        run: python -m unittest discover -s tests -v

      - name: Generate sitemap
        run: |
          # Remove legacy plain-text output when migrating to XML.
          rm -f sitemap.txt sitemap.xml sitemap-*.xml
          python scripts/generate_sitemap.py \
            --site-url https://pato.is-a.dev/ \
            --output sitemap.xml \
            --robots-out robots.txt \
            --sitemap-url https://pato.is-a.dev/sitemap.xml

      # Another commit can land on main while the crawl runs (a manual edit,
      # a merge, or a second run of this workflow). A plain `git push` then
      # fails with "fetch first" and the whole run goes red.
      #
      # So: keep the freshly generated files aside, then on every attempt
      # reset the working tree to the current origin/main tip and copy the
      # generated files over it before committing. Those files are the
      # authoritative output, so they simply replace whatever main has —
      # no merge, no conflict, and nothing a human committed gets lost.
      - name: Commit sitemap if changed
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          shopt -s nullglob

          # Save what we just generated (sitemap.xml, any sitemap-N.xml
          # parts of a sitemap index, and robots.txt).
          generated="$RUNNER_TEMP/generated"
          mkdir -p "$generated"
          for file in sitemap.xml sitemap-*.xml robots.txt; do
            if [ -e "$file" ]; then
              cp -p "$file" "$generated/"
            fi
          done
          if [ -z "$(ls -A "$generated")" ]; then
            echo "::error::Nothing was generated."
            exit 1
          fi

          # Stage sitemap*.xml, sitemap.txt (legacy) and robots.txt only.
          # The helper exists because `git add -A -- 'sitemap*.xml'
          # sitemap.txt robots.txt` exits 128 ("pathspec ... did not match
          # any files") as soon as one pattern matches nothing — the normal
          # case now that sitemap.txt is gone — while a bare `git add -A`
          # would sweep in unrelated scratch files. It is unit-tested in
          # tests/test_stage_sitemap_files.py.
          stage_sitemap_files() {
            bash scripts/stage_sitemap_files.sh
          }

          for attempt in 1 2 3 4 5; do
            # --depth=1 keeps the shallow clone shallow; FETCH_HEAD is used
            # instead of origin/main because actions/checkout's clone doesn't
            # always leave a usable remote-tracking ref.
            git fetch --quiet --depth=1 origin main
            git checkout --quiet --force --detach FETCH_HEAD
            # Remove the previous sitemap (single file or index + parts) so
            # stale sitemap-N.xml parts are deleted rather than left behind.
            rm -f sitemap.txt sitemap.xml sitemap-*.xml
            cp -p "$generated"/* .
            stage_sitemap_files
            if git diff --cached --quiet; then
              echo "No changes (main already up to date)."
              exit 0
            fi
            git commit --quiet -m "chore: update sitemap"
            if git push --quiet origin HEAD:main; then
              echo "Pushed on attempt $attempt."
              echo "pushed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Push rejected (attempt $attempt) — main moved, retrying on the new tip."
            sleep $((attempt * 5))
          done
          echo "::error::Could not push the sitemap after 5 attempts — main kept moving."
          exit 1

      # Events created with GITHUB_TOKEN never start another workflow, so the
      # push above does NOT trigger static.yml (Pages) on its own. Pages here
      # uses build_type=workflow, so without an explicit dispatch the freshly
      # committed sitemap.xml would never be published. workflow_dispatch is
      # the documented exception to that rule, so this works token-lessly.
      - name: Redeploy Pages
        if: steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run static.yml --ref main \
            || echo "::warning::Could not dispatch the Pages deploy — the new sitemap is committed but not yet published."
